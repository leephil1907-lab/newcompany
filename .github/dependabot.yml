version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request per week for routine minor/patch updates
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades (e.g. Next.js, Tailwind, ESLint) need deliberate migration work
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
